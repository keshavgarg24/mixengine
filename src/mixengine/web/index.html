<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mixengine</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>

<header class="bar">
  <span class="brand">mixengine</span>
  <span class="bar-spacer"></span>
  <span id="tier" class="tier"><span class="dot"></span><span id="tier-label">checking…</span></span>
</header>

<main id="main">

  <!-- ── The two sources ────────────────────────────────────────────── -->
  <section class="sources" aria-label="Your vocal and your beat">

    <article class="slot" id="slot-vocal" data-kind="vocal">
      <div class="slot-head">
        <h2>Vocal</h2>
        <span class="slot-meta mono" id="vocal-meta"></span>
      </div>

      <div class="slot-body">
        <div class="slot-empty" id="vocal-empty">
          <canvas class="slot-wave" aria-hidden="true"></canvas>
          <p class="slot-hint">Drop a take here, or record one.</p>
          <div class="slot-actions">
            <button class="btn" data-act="upload" data-kind="vocal" type="button">Upload</button>
            <button class="btn" data-act="record" data-kind="vocal" type="button">Record</button>
          </div>
        </div>

        <div class="slot-filled" id="vocal-filled" hidden>
          <canvas class="slot-wave" id="vocal-wave"></canvas>
          <div class="slot-file">
            <span class="slot-name" id="vocal-name"></span>
            <button class="link" data-act="clear" data-kind="vocal" type="button">Replace</button>
          </div>
        </div>
      </div>
      <input type="file" id="vocal-file" accept="audio/*" hidden>
    </article>

    <article class="slot" id="slot-beat" data-kind="beat">
      <div class="slot-head">
        <h2>Beat</h2>
        <span class="slot-meta mono" id="beat-meta"></span>
      </div>

      <div class="slot-body">
        <div class="slot-empty" id="beat-empty">
          <canvas class="slot-wave" aria-hidden="true"></canvas>
          <p class="slot-hint">Drop a beat here, or record one.</p>
          <div class="slot-actions">
            <button class="btn" data-act="upload" data-kind="beat" type="button">Upload</button>
            <button class="btn" data-act="record" data-kind="beat" type="button">Record</button>
          </div>
        </div>

        <div class="slot-filled" id="beat-filled" hidden>
          <canvas class="slot-wave" id="beat-wave"></canvas>
          <div class="slot-file">
            <span class="slot-name" id="beat-name"></span>
            <button class="link" data-act="clear" data-kind="beat" type="button">Replace</button>
          </div>
        </div>
      </div>
      <input type="file" id="beat-file" accept="audio/*" hidden>
    </article>
  </section>

  <!-- ── Both sources converge on one process ───────────────────────── -->
  <div class="converge" aria-hidden="true"></div>

  <section class="process" aria-label="How to treat this render">

    <details class="treatment" id="treatment">
      <summary>
        <span class="treat-label">Treatment</span>
        <span class="treat-state mono" id="treat-state">everything automatic</span>
      </summary>

      <div class="treat-grid">
        <label class="field">
          <span>The vocal is</span>
          <select id="i-vocal_state">
            <option value="auto">work it out</option>
            <option value="raw">a raw take</option>
            <option value="tuned">already tuned</option>
            <option value="finished">tuned and mixed</option>
          </select>
          <small>A finished vocal is levelled and seated, never re-produced.</small>
        </label>

        <label class="field">
          <span>Recorded to this beat</span>
          <select id="i-relationship">
            <option value="auto">work it out</option>
            <option value="locked">yes, this exact beat</option>
            <option value="free">no, a different beat</option>
          </select>
          <small>If yes, the timing is left exactly as performed.</small>
        </label>

        <label class="field">
          <span>Tuning</span>
          <select id="i-tune">
            <option value="auto">work it out</option>
            <option value="off">leave the pitch alone</option>
            <option value="0.35">gentle</option>
            <option value="0.7">strong</option>
          </select>
          <small>Notes already close to the grid are never moved.</small>
        </label>

        <label class="field">
          <span>Timing</span>
          <select id="i-timing">
            <option value="auto">work it out</option>
            <option value="off">keep my pocket</option>
            <option value="0.45">tighten</option>
          </select>
          <small>Your feel is a performance, not an error.</small>
        </label>

        <label class="field">
          <span>Reverb</span>
          <select id="i-space">
            <option value="auto">work it out</option>
            <option value="keep">keep what's on it</option>
            <option value="match">match the beat's room</option>
            <option value="add">add some</option>
          </select>
          <small>A tail you printed on purpose is part of the sound.</small>
        </label>

        <label class="field">
          <span>Key</span>
          <input type="text" id="i-key" placeholder="work it out" spellcheck="false">
          <small>Such as F minor. Yours wins over anything detected.</small>
        </label>
      </div>
    </details>

    <button class="go" id="go" type="button" disabled>
      <span id="go-label">Add a vocal and a beat</span>
    </button>
  </section>

  <!-- ── While it runs ──────────────────────────────────────────────── -->
  <section class="run" id="run" hidden aria-live="polite">
    <div class="rail"><div class="rail-fill" id="rail-fill"></div></div>
    <p class="run-stage mono" id="run-stage">Starting…</p>
    <div class="plan" id="plan" hidden>
      <p class="plan-summary" id="plan-summary"></p>
      <ul class="plan-list" id="plan-list"></ul>
    </div>
  </section>

  <!-- ── The result ─────────────────────────────────────────────────── -->
  <section class="result" id="result" hidden>
    <div class="result-head">
      <h2 id="result-title">Your song</h2>
      <span class="score mono" id="result-score"></span>
    </div>
    <audio id="player" controls preload="metadata"></audio>
    <div class="gates" id="gates"></div>
    <div class="result-actions">
      <a class="btn" id="download" download>Download</a>
      <button class="btn" id="again" type="button">Change something and run again</button>
    </div>
  </section>

</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
