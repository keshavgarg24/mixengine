name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current release. The floor is not arbitrary:
        # madmom, which is the best downbeat tracker available, pins an old
        # numpy that will not install on newer Pythons.
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 rubberband-cli

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[quality,web,dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: python -m pytest --cov --cov-report=term-missing

  browser:
    # The worklet DSP cannot be checked by the Python suite: it runs on the
    # audio render thread in a browser. `test.html` asserts it against
    # signals whose correct answer is known analytically, and Playwright
    # runs that page headless and reads the result out of the title.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1
          python -m pip install -U pip
          pip install -e ".[web]" playwright
          playwright install --with-deps chromium
      - name: Run the browser audio tests
        run: python scripts/run_browser_tests.py
